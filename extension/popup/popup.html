<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Net Bender</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <div>
      <div class="name">Net Bender</div>
      <div class="tagline">HTTP interceptor</div>
    </div>
  </header>

  <section class="card">
    <div class="tab-row">
      <span id="tab-dot" class="dot"></span>
      <div class="tab-text">
        <div id="tab-title" class="tab-title">Current tab</div>
        <div id="tab-url" class="tab-url"></div>
      </div>
    </div>
    <button id="attach" class="primary wide">Intercept this tab</button>
    <p id="error" class="error" hidden></p>
  </section>

  <section class="toggles">
    <label class="switch"><input type="checkbox" id="toggle-req"><span class="track"></span>Intercept requests</label>
    <label class="switch"><input type="checkbox" id="toggle-res"><span class="track"></span>Intercept responses</label>
  </section>

  <footer class="foot">
    <span id="summary" class="summary"></span>
    <button id="open-console">Open console</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
